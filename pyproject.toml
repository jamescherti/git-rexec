[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-rexec"
version = "1.0.4"
description = "Locate Git repositories and execute commands against them in parallel."
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
authors = [
  {name = "James Cherti"}
]
keywords = ["git", "parallel", "executor", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Version Control :: Git"
]
dependencies = []

[project.optional-dependencies]
colors = ["colorama"]
proctitle = ["setproctitle"]

[project.urls]
Homepage = "https://github.com/jamescherti/git-rexec"
Repository = "https://github.com/jamescherti/git-rexec"

[project.scripts]
pathaction = "git_rexec:main"

[tool.setuptools.packages.find]
include = ["pathaction*"]
